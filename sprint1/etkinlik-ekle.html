<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Portalı</h1>
    </header>

    <nav>
        <a href="index.html">Ana Sayfa</a> |
        <a href="etkinlikler.html">Etkinlikler</a> |
        <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
    </nav>

    <main>
        <h1>Yeni Etkinlik Ekle</h1>

        <form action="#" method="post">
            <p>
                <label for="ad">Etkinlik Adı:</label><br>
                <input type="text" id="ad" name="ad">
            </p>

            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori">
                    <option value="teknoloji">Teknoloji</option>
                    <option value="sanat">Sanat</option>
                    <option value="spor">Spor</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih:</label><br>
                <input type="date" id="tarih" name="tarih">
            </p>

            <p>
                <label for="saat">Saat:</label><br>
                <input type="time" id="saat" name="saat">
            </p>

            <p>
                <label for="yer">Yer:</label><br>
                <input type="text" id="yer" name="yer">
            </p>

            <p>
                <label for="aciklama">Açıklama:</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="50"></textarea>
            </p>

            <button type="submit">Gönder</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Etkinlik Portalı</p>
    </footer>
</body>
</html>
