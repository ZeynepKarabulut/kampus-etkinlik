<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="2516501027.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
    </header>
    <nav>
        <a href="index.html">Ana Sayfa</a> · 
        <a href="etkinlikler.html">Etkinlikler</a> · 
        <a href="etkinlik-ekle.html">Ekle</a> · 
    </nav>
    <main>
    <p class="bilgi">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

    <form id="etkinlik-formu" novalidate>
      <p>
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad">
        <span id="ad-hata" class="hata-mesaj"></span>
      </p>

      <p>
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori">
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
        </select>
        <span id="kategori-hata" class="hata-mesaj"></span>
      </p>

      <p>
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih">
        <span id="tarih-hata" class="hata-mesaj"></span>
      </p>

      <p>
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat">
        <span id="saat-hata" class="hata-mesaj"></span>
      </p>

      <p>
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
        <span id="yer-hata" class="hata-mesaj"></span>
      </p>

      <p>
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan">
        <span id="kontenjan-hata" class="hata-mesaj"></span>
      </p>

      <p>
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="3"></textarea>
        <span id="aciklama-hata" class="hata-mesaj"></span>
      </p>

      <button type="submit" class="btn">Kaydet</button>
    </form>

    <div id="form-mesaj"></div>
  </main>
</body>
</html>
