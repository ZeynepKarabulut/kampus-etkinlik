<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="2516501027.css">
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
    </header>
    <nav>
        <a href="index.html">Ana Sayfa</a> · 
        <a href="etkinlikler.html">Etkinlikler</a> · 
        <a href="etkinlik-ekle.html">Ekle</a> · 
    </nav>
    <main>
        <form>
            <p>
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" required>
            </p>
            <p>
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </p>
            <p>
                <label for="tarih">Tarih</label>
                <input type="text" id="tarih" name="tarih" placeholder="boş bırakıldı" required>
            </p>
            <p>
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="3"></textarea>
            </p>
            <button type="submit">Kaydet</button>
        </form>
    </main>
</body>
</html>
